<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>ImpactSim 3D Globe Demo</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@6.14.0/dist/maplibre-gl.css"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #020617;
        color: #e2e8f0;
        font-family: Arial, Helvetica, sans-serif;
      }

      #map {
        position: absolute;
        inset: 0;
      }

      .demo-header {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;

        width: min(360px, calc(100% - 32px));

        padding: 16px;

        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 14px;

        background: rgba(2, 6, 23, 0.88);

        backdrop-filter: blur(8px);
      }

      .demo-label {
        margin: 0 0 6px;

        color: #67e8f9;

        font-size: 0.72rem;
        letter-spacing: 0.12em;
      }

      .demo-header h1 {
        margin: 0 0 8px;

        font-size: 1.2rem;
      }

      .demo-header p {
        margin: 0;

        color: #cbd5e1;

        font-size: 0.85rem;
        line-height: 1.45;
      }

      .demo-controls {
        position: absolute;

        right: 16px;
        top: 16px;

        z-index: 10;

        display: flex;
        gap: 8px;
      }

      .demo-button {
        padding: 10px 14px;

        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;

        background: rgba(15, 23, 42, 0.9);

        color: white;

        cursor: pointer;
      }

      .demo-button:hover {
        background: rgba(30, 41, 59, 0.95);
      }

      .demo-info {
        position: absolute;

        left: 16px;
        bottom: 16px;

        z-index: 10;

        max-width: calc(100% - 32px);

        padding: 10px 14px;

        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;

        background: rgba(2, 6, 23, 0.86);

        color: #cbd5e1;

        font-size: 0.78rem;
      }

      @media (max-width: 650px) {
        .demo-controls {
          top: auto;
          right: 16px;
          bottom: 16px;
        }

        .demo-info {
          bottom: 70px;
        }
      }
    </style>
  </head>

  <body>

    <div id="map"></div>


    <div class="demo-header">

      <p class="demo-label">
        IMPACTSIM • PORTFOLIO DEMO
      </p>

      <h1>
        Interactive 3D Globe
      </h1>

      <p>
        Drag to rotate the Earth, scroll to zoom, and click
        anywhere to place a demonstration 500 km radius.
      </p>

    </div>


    <div class="demo-controls">

      <button
        id="resetButton"
        class="demo-button"
        type="button"
      >
        Reset Globe
      </button>

      <button
        id="clearButton"
        class="demo-button"
        type="button"
      >
        Clear Impact
      </button>

    </div>


    <div
      id="demoInfo"
      class="demo-info"
    >
      Click the globe to place a demonstration radius.
    </div>


    <script type="module">

      import * as maplibregl from
        "https://unpkg.com/maplibre-gl@6.14.0/dist/maplibre-gl.mjs";


      const EARTH_RADIUS_KM = 6371.0088;

      const DEMO_RADIUS_KM = 500;


      const map = new maplibregl.Map({
        container: "map",

        style:
          "https://demotiles.maplibre.org/style.json",

        center: [0, 20],

        zoom: 1.3,

        pitch: 18,

        bearing: 0,

        maxPitch: 85,

        canvasContextAttributes: {
          antialias: true
        }
      });


      map.addControl(
        new maplibregl.NavigationControl(),
        "bottom-right"
      );


      map.addControl(
        new maplibregl.ScaleControl({
          maxWidth: 120,
          unit: "metric"
        }),
        "bottom-left"
      );


      let marker = null;


      function createGeodesicCircle(
        longitude,
        latitude,
        radiusKm,
        steps = 160
      ) {

        const angularDistance =
          radiusKm / EARTH_RADIUS_KM;


        const lat1 =
          latitude *
          Math.PI /
          180;


        const lon1 =
          longitude *
          Math.PI /
          180;


        const coordinates = [];


        for (
          let i = 0;
          i <= steps;
          i++
        ) {

          const bearing =
            (i / steps) *
            Math.PI *
            2;


          const lat2 =
            Math.asin(
              Math.sin(lat1) *
                Math.cos(angularDistance) +

              Math.cos(lat1) *
                Math.sin(angularDistance) *
                Math.cos(bearing)
            );


          const lon2 =
            lon1 +
            Math.atan2(
              Math.sin(bearing) *
                Math.sin(angularDistance) *
                Math.cos(lat1),

              Math.cos(angularDistance) -
                Math.sin(lat1) *
                Math.sin(lat2)
            );


          let lonDegrees =
            lon2 *
            180 /
            Math.PI;


          const latDegrees =
            lat2 *
            180 /
            Math.PI;


          while (
            lonDegrees -
            longitude >
            180
          ) {
            lonDegrees -= 360;
          }


          while (
            lonDegrees -
            longitude <
            -180
          ) {
            lonDegrees += 360;
          }


          coordinates.push([
            lonDegrees,
            latDegrees
          ]);

        }


        return {
          type: "Feature",

          properties: {},

          geometry: {
            type: "Polygon",

            coordinates: [
              coordinates
            ]
          }
        };

      }


      function emptyFeatureCollection() {

        return {
          type: "FeatureCollection",
          features: []
        };

      }


      map.on(
        "style.load",
        () => {

          map.setProjection({
            type: "globe"
          });


          map.addSource(
            "demo-impact",
            {
              type: "geojson",
              data:
                emptyFeatureCollection()
            }
          );


          map.addLayer({
            id:
              "demo-impact-fill",

            type:
              "fill",

            source:
              "demo-impact",

            paint: {
              "fill-color":
                "#ef4444",

              "fill-opacity":
                0.18
            }
          });


          map.addLayer({
            id:
              "demo-impact-line",

            type:
              "line",

            source:
              "demo-impact",

            paint: {
              "line-color":
                "#ef4444",

              "line-width":
                3,

              "line-opacity":
                0.95
            }
          });

        }
      );


      map.on(
        "click",
        event => {

          const longitude =
            event.lngLat.lng;

          const latitude =
            event.lngLat.lat;


          const circle =
            createGeodesicCircle(
              longitude,
              latitude,
              DEMO_RADIUS_KM
            );


          const source =
            map.getSource(
              "demo-impact"
            );


          if (source) {

            source.setData({
              type:
                "FeatureCollection",

              features: [
                circle
              ]
            });

          }


          if (marker) {
            marker.remove();
          }


          marker =
            new maplibregl.Marker({
              color:
                "#ef4444"
            })
              .setLngLat([
                longitude,
                latitude
              ])
              .addTo(map);


          document
            .getElementById(
              "demoInfo"
            )
            .textContent =
              `Demo radius: ${DEMO_RADIUS_KM} km • ` +
              `${Math.abs(latitude).toFixed(2)}°` +
              `${latitude >= 0 ? "N" : "S"}, ` +
              `${Math.abs(longitude).toFixed(2)}°` +
              `${longitude >= 0 ? "E" : "W"}`;

        }
      );


      document
        .getElementById(
          "resetButton"
        )
        .addEventListener(
          "click",
          () => {

            map.flyTo({
              center: [
                0,
                20
              ],

              zoom: 1.3,

              pitch: 18,

              bearing: 0
            });

          }
        );


      document
        .getElementById(
          "clearButton"
        )
        .addEventListener(
          "click",
          () => {

            const source =
              map.getSource(
                "demo-impact"
              );


            if (source) {

              source.setData(
                emptyFeatureCollection()
              );

            }


            if (marker) {

              marker.remove();

              marker = null;

            }


            document
              .getElementById(
                "demoInfo"
              )
              .textContent =
                "Click the globe to place a demonstration radius.";

          }
        );

    </script>

  </body>
</html>
